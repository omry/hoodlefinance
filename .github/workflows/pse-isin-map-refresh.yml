name: Refresh PSE ISIN Map

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pse-isin-map-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Regenerate PSE ISIN map
        run: node tools/generate-pse-isin-map.js

      - name: Open refresh pull request
        uses: peter-evans/create-pull-request@v8
        with:
          base: main
          branch: automation/pse-isin-map-refresh
          commit-message: Refresh PSE ISIN map
          title: Refresh PSE ISIN map
          body: |
            Generated by the scheduled PSE ISIN map refresh workflow.

            Review the updated `data/pse-isin-map.properties` diff before merging.
          delete-branch: true
