name: Release Prepare

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version in x.y.z format
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-prepare
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare release files
        run: node tools/release.js prepare "${{ inputs.version }}"

      - name: Open release pull request
        uses: peter-evans/create-pull-request@v7
        with:
          base: main
          branch: release/v${{ inputs.version }}
          commit-message: Release v${{ inputs.version }}
          title: Release v${{ inputs.version }}
          body: |
            Generated by the Release Prepare workflow.

            Review these artifacts before merging:
            - `version.properties`
            - `docs/release-notes/v${{ inputs.version }}.md`
            - `docs/release-notes/RELEASE_NOTES.md`
          delete-branch: true
