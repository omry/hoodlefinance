name: Release Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version in x.y.z format
        required: true
        type: string
      ref:
        description: Git ref or commit to publish
        required: false
        default: main
        type: string
  pull_request_target:
    types:
      - closed

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  ADDON_DEPLOY_SCRIPT_ID: "1zB8ohVlbARtuJeNJhdLX0_xnIm9MNlslfdh0z0-OjcNcC3yKrmBNLPrW"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-publish-${{ github.event.pull_request.head.ref || inputs.version || github.run_id }}
  cancel-in-progress: false

jobs:
  validate-demo-credentials:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v'))
    runs-on: ubuntu-latest

    steps:
      - name: Check out release ref
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.pull_request.merge_commit_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Validate demo deployment credentials
        env:
          CLASP_RC_JSON: ${{ secrets.CLASP_RC_JSON }}
          DEMO_SHEET_OAUTH_CLIENT_JSON: ${{ secrets.DEMO_SHEET_OAUTH_CLIENT_JSON }}
          DEMO_SHEET_OAUTH_TOKEN_JSON: ${{ secrets.DEMO_SHEET_OAUTH_TOKEN_JSON }}
        run: |
          test -n "${DEMO_SHEET_OAUTH_CLIENT_JSON}" || { echo "Missing DEMO_SHEET_OAUTH_CLIENT_JSON secret."; exit 1; }
          test -n "${DEMO_SHEET_OAUTH_TOKEN_JSON}" || { echo "Missing DEMO_SHEET_OAUTH_TOKEN_JSON secret."; exit 1; }
          test -n "${CLASP_RC_JSON}" || { echo "Missing CLASP_RC_JSON secret."; exit 1; }

          exec {oauth_client_fd}<<<"${DEMO_SHEET_OAUTH_CLIENT_JSON}"
          exec {oauth_token_fd}<<<"${DEMO_SHEET_OAUTH_TOKEN_JSON}"
          exec {clasp_rc_fd}<<<"${CLASP_RC_JSON}"
          trap 'exec {oauth_client_fd}<&-; exec {oauth_token_fd}<&-; exec {clasp_rc_fd}<&-' EXIT
          unset CLASP_RC_JSON DEMO_SHEET_OAUTH_CLIENT_JSON DEMO_SHEET_OAUTH_TOKEN_JSON

          CLASP_RC_PATH="/proc/$$/fd/${clasp_rc_fd}" \
          DEMO_SHEET_OAUTH_CLIENT_PATH="/proc/$$/fd/${oauth_client_fd}" \
          DEMO_SHEET_OAUTH_TOKEN_PATH="/proc/$$/fd/${oauth_token_fd}" \
          node tools/demo/validate-credentials.js

  publish:
    needs:
      - validate-demo-credentials
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v'))
    runs-on: ubuntu-latest
    outputs:
      addon_version_number: ${{ steps.deploy_addon.outputs.version_number }}
      tag_name: ${{ steps.release_context.outputs.tag_name }}
      version: ${{ steps.release_context.outputs.version }}

    steps:
      - name: Check out release ref
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.pull_request.merge_commit_sha }}

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Resolve release context
        id: release_context
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          VERSION="$(sed -n 's/^version=//p' version.properties | head -n 1)"
          test -n "${VERSION}" || { echo "version.properties is missing version."; exit 1; }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            test "${INPUT_VERSION}" = "${VERSION}" || {
              echo "version.properties must point to ${INPUT_VERSION}, found ${VERSION}."
              exit 1
            }
          else
            test "${RELEASE_BRANCH}" = "release/v${VERSION}" || {
              echo "Merged branch ${RELEASE_BRANCH} does not match release/v${VERSION}."
              exit 1
            }
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag_name=v${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Validate release state
        id: validate_release_state
        env:
          VERSION: ${{ steps.release_context.outputs.version }}
        run: |
          grep -q "^version=${VERSION}$" version.properties
          grep -q "const HOODLEFINANCE_VERSION_ = \"${VERSION}\"" hoodlefinance.js
          test -f "docs/release-notes/v${VERSION}.md"
          grep -q "^## v${VERSION} - " docs/release-notes/RELEASE_NOTES.md

          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            TAG_COMMIT=$(git rev-parse "v${VERSION}^{commit}")
            HEAD_COMMIT=$(git rev-parse HEAD)
            if [ "${TAG_COMMIT}" != "${HEAD_COMMIT}" ]; then
              echo "Tag v${VERSION} already exists on a different commit (${TAG_COMMIT})."
              exit 1
            fi
            echo "Tag v${VERSION} exactly matches HEAD. Safe to proceed."
            echo "skip_tag=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy production add-on version
        id: deploy_addon
        env:
          CLASP_RC_JSON: ${{ secrets.CLASP_RC_JSON }}
        run: |
          test -n "${CLASP_RC_JSON}" || { echo "Missing CLASP_RC_JSON secret."; exit 1; }
          test -n "${ADDON_DEPLOY_SCRIPT_ID}" || { echo "Missing ADDON_DEPLOY_SCRIPT_ID env."; exit 1; }

          exec {clasp_rc_fd}<<<"${CLASP_RC_JSON}"
          trap 'exec {clasp_rc_fd}<&-' EXIT
          unset CLASP_RC_JSON

          target_config_path="${RUNNER_TEMP}/addon-deploy-target.json"
          cat > "${target_config_path}" <<EOF
          {
            "scriptId": "${ADDON_DEPLOY_SCRIPT_ID}"
          }
          EOF

          addon_output="$(
            CLASP_RC_PATH="/proc/$$/fd/${clasp_rc_fd}" \
            node tools/addon/deploy.js --production --target-config "${target_config_path}" 2>&1
          )"
          printf '%s\n' "${addon_output}"

          addon_version_number="$(printf '%s\n' "${addon_output}" | sed -n 's/^Created Apps Script version \([0-9][0-9]*\).*/\1/p' | tail -n 1)"
          test -n "${addon_version_number}" || {
            echo "Failed to parse the deployed add-on version number."
            exit 1
          }

          echo "version_number=${addon_version_number}" >> "${GITHUB_OUTPUT}"
          {
            echo "### Production add-on deployment"
            echo ""
            echo "- Apps Script version: \`${addon_version_number}\`"
            echo "- Script ID: \`${ADDON_DEPLOY_SCRIPT_ID}\`"
            echo ""
            echo "Use this version number when updating the Marketplace SDK."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Warn about add-on version history
        if: steps.deploy_addon.outputs.version_number != ''
        env:
          CLASP_RC_JSON: ${{ secrets.CLASP_RC_JSON }}
        run: |
          test -n "${CLASP_RC_JSON}" || { echo "Missing CLASP_RC_JSON secret."; exit 1; }

          exec {clasp_rc_fd}<<<"${CLASP_RC_JSON}"
          trap 'exec {clasp_rc_fd}<&-' EXIT
          unset CLASP_RC_JSON

          work_dir="${GITHUB_WORKSPACE}/.addon-deploy.local/production/work"
          test -f "${work_dir}/.clasp.json" || {
            echo "Missing add-on worktree config at ${work_dir}/.clasp.json."
            exit 1
          }

          if ! versions_output="$(
            cd "${work_dir}" &&
            CLASP_RC_PATH="/proc/$$/fd/${clasp_rc_fd}" \
            clasp --json list-versions 2>&1
          )"; then
            echo "::warning title=Apps Script version history::Could not inspect the add-on version history."
            {
              echo "### Apps Script version history"
              echo ""
              echo "Could not inspect the add-on version history for the production add-on."
              echo "Open the Apps Script project history UI periodically to prune old versions."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          version_count="$(
            printf '%s\n' "${versions_output}" | node -e '
              const fs = require("node:fs");
              const raw = fs.readFileSync(0, "utf8").trim();
              let parsed = null;
              let versions = [];

              try {
                parsed = JSON.parse(raw);
              } catch (error) {
                parsed = null;
              }

              if (Array.isArray(parsed)) {
                versions = parsed;
              } else if (parsed && Array.isArray(parsed.versions)) {
                versions = parsed.versions;
              } else if (parsed && Array.isArray(parsed.result)) {
                versions = parsed.result;
              } else if (parsed && Array.isArray(parsed.items)) {
                versions = parsed.items;
              } else if (raw) {
                versions = raw.split(/\r?\n/).filter(function (line) {
                  return /^\s*(?:v)?\d+/.test(line);
                });
              }

              process.stdout.write(String(versions.length));
            '
          )"

          {
            echo "### Apps Script version history"
            echo ""
            echo "- Current version count: \`${version_count}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ "${version_count}" -gt 100 ]; then
            warning_message="Add-on version history is at ${version_count} entries. Trim older Apps Script versions in the Apps Script project history UI."
            echo "::warning title=Apps Script version history::${warning_message}"
            {
              echo ""
              echo "- Warning: ${warning_message}"
              echo ""
              echo "Open the Apps Script project history UI to prune older versions."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Create and push release tag
        if: steps.validate_release_state.outputs.skip_tag != 'true'
        env:
          TAG_NAME: ${{ steps.release_context.outputs.tag_name }}
        run: |
          git tag -a "${TAG_NAME}" -m "Release ${TAG_NAME}"
          git push origin "${TAG_NAME}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/release-notes/v${{ steps.release_context.outputs.version }}.md
          generate_release_notes: false
          name: ${{ steps.release_context.outputs.tag_name }}
          tag_name: ${{ steps.release_context.outputs.tag_name }}

  sync-demo:
    needs: publish
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Check out released tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.publish.outputs.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Sync public demo sheet
        env:
          CLASP_RC_JSON: ${{ secrets.CLASP_RC_JSON }}
          DEMO_SHEET_OAUTH_CLIENT_JSON: ${{ secrets.DEMO_SHEET_OAUTH_CLIENT_JSON }}
          DEMO_SHEET_OAUTH_TOKEN_JSON: ${{ secrets.DEMO_SHEET_OAUTH_TOKEN_JSON }}
          HOODLEFINANCE_NON_INTERACTIVE: "1"
        run: |
          test -n "${DEMO_SHEET_OAUTH_CLIENT_JSON}" || { echo "Missing DEMO_SHEET_OAUTH_CLIENT_JSON secret."; exit 1; }
          test -n "${DEMO_SHEET_OAUTH_TOKEN_JSON}" || { echo "Missing DEMO_SHEET_OAUTH_TOKEN_JSON secret."; exit 1; }
          test -n "${CLASP_RC_JSON}" || { echo "Missing CLASP_RC_JSON secret."; exit 1; }

          exec {oauth_client_fd}<<<"${DEMO_SHEET_OAUTH_CLIENT_JSON}"
          exec {oauth_token_fd}<<<"${DEMO_SHEET_OAUTH_TOKEN_JSON}"
          exec {clasp_rc_fd}<<<"${CLASP_RC_JSON}"
          trap 'exec {oauth_client_fd}<&-; exec {oauth_token_fd}<&-; exec {clasp_rc_fd}<&-' EXIT
          unset CLASP_RC_JSON DEMO_SHEET_OAUTH_CLIENT_JSON DEMO_SHEET_OAUTH_TOKEN_JSON

          CLASP_RC_PATH="/proc/$$/fd/${clasp_rc_fd}" \
          DEMO_SHEET_OAUTH_CLIENT_PATH="/proc/$$/fd/${oauth_client_fd}" \
          DEMO_SHEET_OAUTH_TOKEN_PATH="/proc/$$/fd/${oauth_token_fd}" \
          HOODLEFINANCE_DEMO_OAUTH_TOKEN_READ_ONLY="1" \
          node tools/demo/sync.js --production

  rollback-release-on-demo-failure:
    needs:
      - publish
      - sync-demo
    if: needs.publish.result == 'success' && needs.sync-demo.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Delete partially published release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.publish.outputs.tag_name }}
        run: |
          test -n "${TAG_NAME}" || { echo "Missing tag name for rollback."; exit 1; }
          gh release delete "${TAG_NAME}" --cleanup-tag --yes
