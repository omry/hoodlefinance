name: Release Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version in x.y.z format
        required: true
        type: string
      ref:
        description: Git ref or commit to publish
        required: false
        default: main
        type: string
      dry_run:
        description: Run the add-on publish path without creating a new Apps Script version
        required: false
        default: false
        type: boolean
  pull_request_target:
    types:
      - closed

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  ADDON_DEPLOY_SCRIPT_ID: "1zB8ohVlbARtuJeNJhdLX0_xnIm9MNlslfdh0z0-OjcNcC3yKrmBNLPrW"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-publish-${{ github.event.pull_request.head.ref || inputs.version || github.run_id }}
  cancel-in-progress: false

jobs:
  resolve-release:
    name: Resolve release
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v'))
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.release_context.outputs.release_sha }}
      tag_name: ${{ steps.release_context.outputs.tag_name }}
      version: ${{ steps.release_context.outputs.version }}

    steps:
      - name: Check out requested release ref
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.pull_request.merge_commit_sha }}

      - name: Resolve release context
        id: release_context
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          VERSION="$(sed -n 's/^version=//p' version.properties | head -n 1)"
          RELEASE_SHA="$(git rev-parse HEAD)"
          test -n "${VERSION}" || { echo "version.properties is missing version."; exit 1; }
          test -n "${RELEASE_SHA}" || { echo "Failed to resolve release SHA."; exit 1; }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            test "${INPUT_VERSION}" = "${VERSION}" || {
              echo "version.properties must point to ${INPUT_VERSION}, found ${VERSION}."
              exit 1
            }
          else
            test "${RELEASE_BRANCH}" = "release/v${VERSION}" || {
              echo "Merged branch ${RELEASE_BRANCH} does not match release/v${VERSION}."
              exit 1
            }
          fi

          echo "release_sha=${RELEASE_SHA}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag_name=v${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Validate release state
        env:
          RELEASE_SHA: ${{ steps.release_context.outputs.release_sha }}
          TAG_NAME: ${{ steps.release_context.outputs.tag_name }}
          VERSION: ${{ steps.release_context.outputs.version }}
        run: |
          TAG_REF="refs/tags/${TAG_NAME}"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          test "${HEAD_COMMIT}" = "${RELEASE_SHA}" || {
            echo "Checked out commit ${HEAD_COMMIT} does not match resolved release SHA ${RELEASE_SHA}."
            exit 1
          }

          git fetch --force --tags origin

          grep -q "^version=${VERSION}$" version.properties
          grep -q "const HOODLEFINANCE_VERSION_ = \"${VERSION}\"" hoodlefinance.js
          test -f "docs/release-notes/${TAG_NAME}.md"
          grep -q "^## ${TAG_NAME} - " docs/release-notes/RELEASE_NOTES.md

          if git rev-parse "${TAG_REF}" >/dev/null 2>&1; then
            TAG_COMMIT="$(git rev-parse "${TAG_REF}^{commit}")"
            if [ "${TAG_COMMIT}" != "${RELEASE_SHA}" ]; then
              echo "Tag ${TAG_NAME} already exists on a different commit (${TAG_COMMIT})."
              exit 1
            fi
            echo "Tag ${TAG_NAME} already points at ${RELEASE_SHA}. Safe to proceed."
          fi

  validate-publish-credentials:
    name: Validate publish credentials
    needs:
      - resolve-release
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v'))
    runs-on: ubuntu-latest

    steps:
      - name: Check out resolved release SHA
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-release.outputs.release_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install clasp
        run: npm install -g @google/clasp@3.3.0

      - name: Syntax check publish tooling
        run: |
          node --check hoodlefinance.js
          node --check tools/validate-json-secret.js
          node --check tools/clasp-auth.js
          node --check tools/cli-reporting.js
          node --check tools/addon/deploy.js
          node --check tools/demo/sync.js
          node --check tools/demo/validate-credentials.js
          node -e '
            const fs = require("node:fs");
            JSON.parse(fs.readFileSync("docs/google-sheets-editor-addon/appsscript.json", "utf8"));
            JSON.parse(fs.readFileSync("docs/google-sheets-editor-addon/addon-deploy-layout.json", "utf8"));
            JSON.parse(fs.readFileSync("docs/demo-sheet/demo-sheet.json", "utf8"));
          '

      - name: Validate demo deployment JSON secrets
        env:
          DEMO_SHEET_CLASP_RC_JSON: ${{ secrets.DEMO_SHEET_CLASP_RC_JSON }}
          DEMO_SHEET_OAUTH_CLIENT_JSON: ${{ secrets.DEMO_SHEET_OAUTH_CLIENT_JSON }}
          DEMO_SHEET_OAUTH_TOKEN_JSON: ${{ secrets.DEMO_SHEET_OAUTH_TOKEN_JSON }}
        run: |
          echo "Validating demo JSON secrets..."
          node tools/validate-json-secret.js \
            DEMO_SHEET_OAUTH_CLIENT_JSON \
            DEMO_SHEET_OAUTH_TOKEN_JSON \
            DEMO_SHEET_CLASP_RC_JSON

      - name: Validate demo deployment credentials
        env:
          DEMO_SHEET_CLASP_RC_JSON: ${{ secrets.DEMO_SHEET_CLASP_RC_JSON }}
          DEMO_SHEET_OAUTH_CLIENT_JSON: ${{ secrets.DEMO_SHEET_OAUTH_CLIENT_JSON }}
          DEMO_SHEET_OAUTH_TOKEN_JSON: ${{ secrets.DEMO_SHEET_OAUTH_TOKEN_JSON }}
        run: |
          oauth_client_path="$(mktemp "${RUNNER_TEMP}/demo-oauth-client.XXXXXX.json")"
          oauth_token_path="$(mktemp "${RUNNER_TEMP}/demo-oauth-token.XXXXXX.json")"
          clasp_rc_path="$(mktemp "${RUNNER_TEMP}/demo-clasprc.XXXXXX.json")"
          chmod 600 "${oauth_client_path}" "${oauth_token_path}" "${clasp_rc_path}"
          printf '%s' "${DEMO_SHEET_OAUTH_CLIENT_JSON}" > "${oauth_client_path}"
          printf '%s' "${DEMO_SHEET_OAUTH_TOKEN_JSON}" > "${oauth_token_path}"
          printf '%s' "${DEMO_SHEET_CLASP_RC_JSON}" > "${clasp_rc_path}"
          trap 'rm -f "${oauth_client_path}" "${oauth_token_path}" "${clasp_rc_path}"' EXIT
          unset DEMO_SHEET_CLASP_RC_JSON DEMO_SHEET_OAUTH_CLIENT_JSON DEMO_SHEET_OAUTH_TOKEN_JSON

          CLASP_RC_PATH="${clasp_rc_path}" \
          DEMO_SHEET_OAUTH_CLIENT_PATH="${oauth_client_path}" \
          DEMO_SHEET_OAUTH_TOKEN_PATH="${oauth_token_path}" \
          node tools/demo/validate-credentials.js

      - name: Validate add-on deployment JSON secret
        env:
          ADDON_DEPLOY_CLASP_RC_JSON: ${{ secrets.ADDON_DEPLOY_CLASP_RC_JSON }}
        run: |
          echo "Validating add-on JSON secret..."
          node tools/validate-json-secret.js ADDON_DEPLOY_CLASP_RC_JSON

      - name: Validate add-on deployment credentials
        env:
          ADDON_DEPLOY_CLASP_RC_JSON: ${{ secrets.ADDON_DEPLOY_CLASP_RC_JSON }}
        run: |
          clasp_rc_path="$(mktemp "${RUNNER_TEMP}/addon-clasprc.XXXXXX.json")"
          chmod 600 "${clasp_rc_path}"
          printf '%s' "${ADDON_DEPLOY_CLASP_RC_JSON}" > "${clasp_rc_path}"
          trap 'rm -f "${clasp_rc_path}"' EXIT
          unset ADDON_DEPLOY_CLASP_RC_JSON

          if ! clasp_identity="$(clasp -A "${clasp_rc_path}" show-authorized-user 2>&1)"; then
            printf '%s\n' "${clasp_identity}"
            exit 1
          fi

          clasp_identity="$(printf '%s\n' "${clasp_identity}" | sed '/^[[:space:]]*$/d')"
          clasp_email="$(printf '%s\n' "${clasp_identity}" | grep -Eo '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' | tail -n 1 || true)"
          if printf '%s\n' "${clasp_identity}" | grep -qi '^Not logged in\.$'; then
            echo "Add-on clasp validation reported that the auth is not logged in."
            printf '%s\n' "${clasp_identity}"
            exit 1
          fi
          if [ -z "${clasp_email}" ]; then
            echo "Add-on clasp validation did not return a usable email identity."
            printf '%s\n' "${clasp_identity}"
            exit 1
          fi

          echo "Add-on clasp identity: ${clasp_email}"

  create-release-tag:
    name: Create release tag
    needs:
      - resolve-release
      - validate-publish-credentials
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v'))
    runs-on: ubuntu-latest

    steps:
      - name: Check out resolved release SHA
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-release.outputs.release_sha }}

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create or confirm release tag
        env:
          RELEASE_SHA: ${{ needs.resolve-release.outputs.release_sha }}
          TAG_NAME: ${{ needs.resolve-release.outputs.tag_name }}
        run: |
          TAG_REF="refs/tags/${TAG_NAME}"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          test "${HEAD_COMMIT}" = "${RELEASE_SHA}" || {
            echo "Checked out commit ${HEAD_COMMIT} does not match resolved release SHA ${RELEASE_SHA}."
            exit 1
          }

          git fetch --force --tags origin

          if git rev-parse "${TAG_REF}" >/dev/null 2>&1; then
            TAG_COMMIT="$(git rev-parse "${TAG_REF}^{commit}")"
            if [ "${TAG_COMMIT}" != "${RELEASE_SHA}" ]; then
              echo "Tag ${TAG_NAME} already exists on a different commit (${TAG_COMMIT})."
              exit 1
            fi
            echo "Tag ${TAG_NAME} already points at ${RELEASE_SHA}. Skipping creation."
            exit 0
          fi

          git tag -a "${TAG_NAME}" "${RELEASE_SHA}" -m "Release ${TAG_NAME}"
          if ! git push origin "refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}"; then
            git fetch --force --tags origin
            if git rev-parse "${TAG_REF}" >/dev/null 2>&1; then
              TAG_COMMIT="$(git rev-parse "${TAG_REF}^{commit}")"
              if [ "${TAG_COMMIT}" = "${RELEASE_SHA}" ]; then
                echo "Tag ${TAG_NAME} was created concurrently on the expected commit."
                exit 0
              fi
            fi
            echo "Failed to push tag ${TAG_NAME}."
            exit 1
          fi

          git fetch --force --tags origin
          TAG_COMMIT="$(git rev-parse "${TAG_REF}^{commit}")"
          test "${TAG_COMMIT}" = "${RELEASE_SHA}" || {
            echo "Tag ${TAG_NAME} resolved to ${TAG_COMMIT} after push, expected ${RELEASE_SHA}."
            exit 1
          }

  publish-addon:
    name: Publish add-on
    needs:
      - resolve-release
      - create-release-tag
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v'))
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: refs/tags/${{ needs.resolve-release.outputs.tag_name }}

      - name: Verify checked out release tag
        env:
          RELEASE_SHA: ${{ needs.resolve-release.outputs.release_sha }}
          TAG_NAME: ${{ needs.resolve-release.outputs.tag_name }}
        run: |
          TAG_REF="refs/tags/${TAG_NAME}"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          TAG_COMMIT="$(git rev-parse "${TAG_REF}^{commit}")"

          test "${HEAD_COMMIT}" = "${RELEASE_SHA}" || {
            echo "Checked out commit ${HEAD_COMMIT} does not match resolved release SHA ${RELEASE_SHA}."
            exit 1
          }
          test "${TAG_COMMIT}" = "${RELEASE_SHA}" || {
            echo "Tag ${TAG_NAME} points at ${TAG_COMMIT}, expected ${RELEASE_SHA}."
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install clasp
        run: npm install -g @google/clasp@3.3.0

      - name: Deploy production add-on version
        id: deploy_addon
        env:
          ADDON_DEPLOY_CLASP_RC_JSON: ${{ secrets.ADDON_DEPLOY_CLASP_RC_JSON }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          test -n "${ADDON_DEPLOY_SCRIPT_ID}" || { echo "Missing ADDON_DEPLOY_SCRIPT_ID env."; exit 1; }

          clasp_rc_path="$(mktemp "${RUNNER_TEMP}/addon-clasprc.XXXXXX.json")"
          chmod 600 "${clasp_rc_path}"
          printf '%s' "${ADDON_DEPLOY_CLASP_RC_JSON}" > "${clasp_rc_path}"
          trap 'rm -f "${clasp_rc_path}"' EXIT
          unset ADDON_DEPLOY_CLASP_RC_JSON

          target_config_path="${RUNNER_TEMP}/addon-deploy-target.json"
          cat > "${target_config_path}" <<EOF
          {
            "scriptId": "${ADDON_DEPLOY_SCRIPT_ID}"
          }
          EOF

          deploy_args=(--production)
          if [ "${DRY_RUN}" = "true" ]; then
            deploy_args+=(--dry-run)
          fi

          if ! addon_output="$(
            CLASP_RC_PATH="${clasp_rc_path}" \
            node tools/addon/deploy.js "${deploy_args[@]}" --target-config "${target_config_path}" 2>&1
          )"; then
            printf '%s\n' "${addon_output}"
            exit 1
          fi
          printf '%s\n' "${addon_output}"

          if [ "${DRY_RUN}" = "true" ]; then
            addon_version_number="dry-run"
          else
            addon_version_number="$(printf '%s\n' "${addon_output}" | sed -n 's/^Created Apps Script version \([0-9][0-9]*\).*/\1/p' | tail -n 1)"
            test -n "${addon_version_number}" || {
              echo "Failed to parse the deployed add-on version number."
              exit 1
            }
          fi

          echo "version_number=${addon_version_number}" >> "${GITHUB_OUTPUT}"
          if [ "${DRY_RUN}" = "true" ]; then
            {
              echo "### Production add-on deployment"
              echo ""
              echo "- Dry run: \`true\`"
              echo "- Apps Script version: \`${addon_version_number}\`"
              echo "- Script ID: \`${ADDON_DEPLOY_SCRIPT_ID}\`"
              echo ""
              echo "This run exercised the add-on publish path without creating a new Apps Script version."
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            {
              echo "### Production add-on deployment"
              echo ""
              echo "- Apps Script version: \`${addon_version_number}\`"
              echo "- Script ID: \`${ADDON_DEPLOY_SCRIPT_ID}\`"
              echo ""
              echo "Use this version number when updating the Marketplace SDK."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Warn about add-on version history
        if: steps.deploy_addon.outputs.version_number != ''
        env:
          ADDON_DEPLOY_CLASP_RC_JSON: ${{ secrets.ADDON_DEPLOY_CLASP_RC_JSON }}
        run: |
          clasp_rc_path="$(mktemp "${RUNNER_TEMP}/addon-clasprc.XXXXXX.json")"
          chmod 600 "${clasp_rc_path}"
          printf '%s' "${ADDON_DEPLOY_CLASP_RC_JSON}" > "${clasp_rc_path}"
          trap 'rm -f "${clasp_rc_path}"' EXIT
          unset ADDON_DEPLOY_CLASP_RC_JSON

          work_dir="${GITHUB_WORKSPACE}/.addon-deploy.local/production/work"
          test -f "${work_dir}/.clasp.json" || {
            echo "Missing add-on worktree config at ${work_dir}/.clasp.json."
            exit 1
          }

          if ! versions_output="$(
            cd "${work_dir}" &&
            clasp -A "${clasp_rc_path}" --json list-versions 2>&1
          )"; then
            echo "::warning title=Apps Script version history::Failed to inspect the add-on version history."
            printf '%s\n' "${versions_output}"
            {
              echo "### Apps Script version history"
              echo ""
              echo "Failed to inspect the add-on version history for the production add-on."
              echo ""
              echo "The underlying \`clasp list-versions\` error was written to the job log."
              echo "Open the Apps Script project history UI periodically to prune old versions."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          version_count="$(
            printf '%s\n' "${versions_output}" | node -e '
              const fs = require("node:fs");
              const raw = fs.readFileSync(0, "utf8").trim();
              let parsed = null;
              let versions = [];

              try {
                parsed = JSON.parse(raw);
              } catch (error) {
                parsed = null;
              }

              if (Array.isArray(parsed)) {
                versions = parsed;
              } else if (parsed && Array.isArray(parsed.versions)) {
                versions = parsed.versions;
              } else if (parsed && Array.isArray(parsed.result)) {
                versions = parsed.result;
              } else if (parsed && Array.isArray(parsed.items)) {
                versions = parsed.items;
              } else if (raw) {
                versions = raw.split(/\r?\n/).filter(function (line) {
                  return /^\s*(?:v)?\d+/.test(line);
                });
              }

              process.stdout.write(String(versions.length));
            '
          )"

          {
            echo "### Apps Script version history"
            echo ""
            echo "- Current version count: \`${version_count}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ "${version_count}" -gt 100 ]; then
            warning_message="Add-on version history is at ${version_count} entries. Trim older Apps Script versions in the Apps Script project history UI."
            echo "::warning title=Apps Script version history::${warning_message}"
            {
              echo ""
              echo "- Warning: ${warning_message}"
              echo ""
              echo "Open the Apps Script project history UI to prune older versions."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

  sync-demo:
    name: Sync public demo sheet
    needs:
      - resolve-release
      - create-release-tag
      - publish-addon
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v'))
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: refs/tags/${{ needs.resolve-release.outputs.tag_name }}

      - name: Verify checked out release tag
        env:
          RELEASE_SHA: ${{ needs.resolve-release.outputs.release_sha }}
          TAG_NAME: ${{ needs.resolve-release.outputs.tag_name }}
        run: |
          TAG_REF="refs/tags/${TAG_NAME}"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          TAG_COMMIT="$(git rev-parse "${TAG_REF}^{commit}")"

          test "${HEAD_COMMIT}" = "${RELEASE_SHA}" || {
            echo "Checked out commit ${HEAD_COMMIT} does not match resolved release SHA ${RELEASE_SHA}."
            exit 1
          }
          test "${TAG_COMMIT}" = "${RELEASE_SHA}" || {
            echo "Tag ${TAG_NAME} points at ${TAG_COMMIT}, expected ${RELEASE_SHA}."
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install clasp
        run: npm install -g @google/clasp@3.3.0

      - name: Sync public demo sheet
        env:
          DEMO_SHEET_CLASP_RC_JSON: ${{ secrets.DEMO_SHEET_CLASP_RC_JSON }}
          DEMO_SHEET_OAUTH_CLIENT_JSON: ${{ secrets.DEMO_SHEET_OAUTH_CLIENT_JSON }}
          DEMO_SHEET_OAUTH_TOKEN_JSON: ${{ secrets.DEMO_SHEET_OAUTH_TOKEN_JSON }}
          HOODLEFINANCE_NON_INTERACTIVE: "1"
        run: |
          echo "Validating demo JSON secrets for public sync..."
          node tools/validate-json-secret.js \
            DEMO_SHEET_OAUTH_CLIENT_JSON \
            DEMO_SHEET_OAUTH_TOKEN_JSON \
            DEMO_SHEET_CLASP_RC_JSON

          oauth_client_path="$(mktemp "${RUNNER_TEMP}/demo-oauth-client.XXXXXX.json")"
          oauth_token_path="$(mktemp "${RUNNER_TEMP}/demo-oauth-token.XXXXXX.json")"
          clasp_rc_path="$(mktemp "${RUNNER_TEMP}/demo-clasprc.XXXXXX.json")"
          chmod 600 "${oauth_client_path}" "${oauth_token_path}" "${clasp_rc_path}"
          printf '%s' "${DEMO_SHEET_OAUTH_CLIENT_JSON}" > "${oauth_client_path}"
          printf '%s' "${DEMO_SHEET_OAUTH_TOKEN_JSON}" > "${oauth_token_path}"
          printf '%s' "${DEMO_SHEET_CLASP_RC_JSON}" > "${clasp_rc_path}"
          trap 'rm -f "${oauth_client_path}" "${oauth_token_path}" "${clasp_rc_path}"' EXIT
          unset DEMO_SHEET_CLASP_RC_JSON DEMO_SHEET_OAUTH_CLIENT_JSON DEMO_SHEET_OAUTH_TOKEN_JSON

          CLASP_RC_PATH="${clasp_rc_path}" \
          DEMO_SHEET_OAUTH_CLIENT_PATH="${oauth_client_path}" \
          DEMO_SHEET_OAUTH_TOKEN_PATH="${oauth_token_path}" \
          HOODLEFINANCE_DEMO_OAUTH_TOKEN_READ_ONLY="1" \
          node tools/demo/sync.js --production

  create-github-release:
    name: Create GitHub release
    needs:
      - resolve-release
      - create-release-tag
      - publish-addon
      - sync-demo
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v'))
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: refs/tags/${{ needs.resolve-release.outputs.tag_name }}

      - name: Verify checked out release tag
        env:
          RELEASE_SHA: ${{ needs.resolve-release.outputs.release_sha }}
          TAG_NAME: ${{ needs.resolve-release.outputs.tag_name }}
        run: |
          TAG_REF="refs/tags/${TAG_NAME}"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          TAG_COMMIT="$(git rev-parse "${TAG_REF}^{commit}")"

          test "${HEAD_COMMIT}" = "${RELEASE_SHA}" || {
            echo "Checked out commit ${HEAD_COMMIT} does not match resolved release SHA ${RELEASE_SHA}."
            exit 1
          }
          test "${TAG_COMMIT}" = "${RELEASE_SHA}" || {
            echo "Tag ${TAG_NAME} points at ${TAG_COMMIT}, expected ${RELEASE_SHA}."
            exit 1
          }

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/release-notes/v${{ needs.resolve-release.outputs.version }}.md
          generate_release_notes: false
          name: ${{ needs.resolve-release.outputs.tag_name }}
          tag_name: ${{ needs.resolve-release.outputs.tag_name }}
